name: Auto Update AI Models Data

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-24.04

    steps:
    - name: 내 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필요한 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests supabase

    - name: 데이터 수집 파이썬 스크립트 실행
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # ⚡ 작업 폴더 위치를 명확히 지정
      run: python script/sync_models.py